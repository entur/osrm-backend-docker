replicas: 2

rollingUpdate:
  maxSurge: 2
  maxUnavailable: 0

init:
  resources:
    memLimit: 16000Mi
    cpuRequest: 6
    memRequest: 14000Mi

resources:
  memLimit: 4000Mi
  cpuRequest: 200m
  memRequest: 2000Mi

image:
  identifier: <+artifacts.primary.image>
  imagePullPolicy: Always

service:
  http:
    internalPort: 5000
    externalPort: 80

secrets:
  slack:
    - SLACK_URL

data:
  # GCS graph-format prefix (NOT the OSRM software version). Bump this on a major
  # osrm-backend upgrade, paired with a graph rebuild into the new prefix. See the
  # "Upgrading the OSRM version" runbook in README.md.
  osrmVersion: v26

profiles:
  - name: bus
  - name: rail
  - name: ferry
    serviceName: water

apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ template "app.name" . }}-water-redeploy-cronjob
  namespace: osrm
  labels:
    {{- include "common.labels" . | indent 4 }}
    app: osrm-cronjob
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: osm-data
              emptyDir:
                sizeLimit: 10Gi
          initContainers:
            - name: download-osm-data
              image: curlimages/curl:8.12.1
              command: ['sh', '-c', 'curl -o /data/norway-latest.osm.pbf https://storage.googleapis.com/{{ .Values.cronJob.gcpBucketName }}/norway-latest.osm.pbf']
              volumeMounts:
                - mountPath: /data
                  name: osm-data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
            - name: osrm-extract
              image: {{ .Values.image.identifier }}
              imagePullPolicy: {{ .Values.image.imagePullPolicy }}
              command: ['osrm-extract', '-p', '/opt/ferry.lua', '/data/norway-latest.osm.pbf']
              resources:
                limits:
                  memory: {{ .Values.init.resources.memLimit }}
                requests:
                  cpu: {{ .Values.init.resources.cpuRequest }}
                  memory: {{ .Values.init.resources.memRequest }}
              volumeMounts:
                - mountPath: /data
                  name: osm-data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
            - name: osrm-contract
              image: {{ .Values.image.identifier }}
              imagePullPolicy: {{ .Values.image.imagePullPolicy }}
              command: ['osrm-contract', '/data/norway-latest.osrm']
              volumeMounts:
                - mountPath: /data
                  name: osm-data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
            - name: upload-osrm-data
              image: google/cloud-sdk:408.0.1
              command:
                - sh
                - -c
                - 'gsutil -m rsync -d -r -x "^(?!.*norway-latest.osrm\.).*" /data gs://marduk-dev/osrm/osrm-water/'
              env:
                - name: CLOUDSDK_CORE_DISABLE_PROMPTS
                  value: "1"
              volumeMounts:
                - mountPath: /data
                  name: osm-data
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - command:
                - ./redeploy_generic_deployment.sh
              envFrom:
                - secretRef:
                    name: slack
              env:
                - name: DEPLOYMENT
                  value: osrm-water
                - name: CLOUDSDK_CORE_PROJECT
                  value: {{ .Values.cronJob.gcpProject }}
              image: eu.gcr.io/entur-system-1287/deployment-rollout-restart:0.1.2
              imagePullPolicy: IfNotPresent
              name: redeploy-osrm-water
              resources: {}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          serviceAccountName: application
          terminationGracePeriodSeconds: 30
  schedule: 0 2 * * *
  successfulJobsHistoryLimit: 3
  suspend: true

{{- range $profile := .Values.profiles }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "common.labels" . | indent 4 }}
    app: osrm-{{ $profile }}
  name: {{ template "app.name" . }}-{{ $profile }}
  namespace: osrm
spec:
  ports:
    - name: http
      port: {{ .Values.service.http.externalPort }}
      protocol: TCP
      targetPort: {{ .Values.service.http.internalPort }}
  selector:
    app: {{ template "app.name" . }}-{{ $profile }}
  sessionAffinity: None
  type: ClusterIP
{{- end }}

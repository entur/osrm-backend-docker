{{- range .Values.profiles }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "common.labels" $ | indent 4 }}
    app: osrm-{{ .name }}
  annotations:
    {{- include "common.annotations" $ | indent 4 }}
  name: {{ template "app.name" $ }}-{{ .serviceName | default .name }}
  namespace: osrm
spec:
  ports:
    - name: http
      port: {{ $.Values.service.http.externalPort }}
      protocol: TCP
      targetPort: {{ $.Values.service.http.internalPort }}
  selector:
    app: {{ template "app.name" $ }}-{{ .name }}
  sessionAffinity: None
  type: ClusterIP
{{- end }}

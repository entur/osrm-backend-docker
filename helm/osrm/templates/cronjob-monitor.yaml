apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ template "app.name" . }}-monitor-osm-data
  namespace: osrm
  labels:
    {{- include "common.labels" . | indent 4 }}
    app: osrm-monitor
  annotations:
    {{- include "common.annotations" . | indent 4 }}
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: check-osm-updates
              image: google/cloud-sdk:537.0.0
              command:
                - sh
                - -c
                - |
                  set -e

                  # Download current MD5 from OSM source
                  echo "Downloading MD5 from OSM source..."
                  curl -sf "{{ .Values.data.osmDataUrl }}.md5" -o /tmp/current.md5

                  # Extract just the MD5 hash (in case the file contains filename too)
                  CURRENT_MD5=$(cat /tmp/current.md5 | awk '{print $1}')
                  echo "Current OSM MD5: $CURRENT_MD5"

                  # Check if we have a stored MD5 in our bucket
                  echo "Checking for stored MD5 in our bucket..."
                  if gsutil -q stat "gs://{{ .Values.data.osrmDataBucket }}/osm-latest.md5" 2>/dev/null; then
                    gsutil -q cp "gs://{{ .Values.data.osrmDataBucket }}/osm-latest.md5" /tmp/stored.md5
                    STORED_MD5=$(cat /tmp/stored.md5 | awk '{print $1}')
                    echo "Stored MD5: $STORED_MD5"

                    if [ "$CURRENT_MD5" = "$STORED_MD5" ]; then
                      echo "MD5 matches - no update needed"
                      exit 0
                    else
                      echo "MD5 changed - triggering redeploy"
                    fi
                  else
                    echo "No stored MD5 found - first run, triggering redeploy"
                  fi

                  # Profile names, not service names: ferry serves under serviceName "water".
                  PROFILES="{{ range .Values.profiles }}{{ .name }} {{ end }}"
                  [ -n "${PROFILES% }" ] || { echo "No profiles configured"; exit 1; }
                  echo "Profiles: $PROFILES"

                  # Name keyed on the hash transition, lowercased for DNS-1123: a retried pod
                  # re-creates only what is missing, while a rollback (A->B->A) still rebuilds
                  # rather than matching the job left over from the first A.
                  echo "Triggering redeploy cronjobs..."
                  FROM=$(echo "${STORED_MD5:-none}" | cut -c1-10 | tr 'A-Z' 'a-z')
                  TO=$(echo "$CURRENT_MD5" | cut -c1-10 | tr 'A-Z' 'a-z')
                  for PROFILE in $PROFILES; do
                    echo "Creating job for osrm-$PROFILE..."
                    OUT=$(kubectl create job --from=cronjob/osrm-$PROFILE-redeploy-cronjob "osrm-$PROFILE-$FROM-$TO" -n osrm 2>&1) \
                      || case "$OUT" in *AlreadyExists*) ;; *) echo "$OUT" >&2; exit 1 ;; esac
                    echo "$OUT"
                  done

                  # Last: the stored MD5 marks this OSM version handled. Writing it before the
                  # jobs exist would permanently skip any profile whose trigger failed.
                  echo "$CURRENT_MD5" > /tmp/new.md5
                  gsutil -q cp /tmp/new.md5 "gs://{{ .Values.data.osrmDataBucket }}/osm-latest.md5"
                  echo "Stored new MD5 in bucket"

                  echo "All redeploy jobs triggered successfully"
              env:
                - name: CLOUDSDK_CORE_DISABLE_PROMPTS
                  value: "1"
              resources:
                limits:
                  memory: 256Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          serviceAccountName: application
          terminationGracePeriodSeconds: 30
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  suspend: false

name: Test OSRM Profiles

on:
  push:
    branches: [ rutebanken ]
    paths:
      - 'profiles/**'
      - 'Dockerfile'
      - 'docker-compose.test.yml'
      - 'run-test.sh'
  pull_request:
    branches: [ rutebanken ]
    paths:
      - 'profiles/**'
      - 'Dockerfile'
      - 'docker-compose.test.yml'
      - 'run-test.sh'
  workflow_dispatch:

jobs:
  test-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create test directories
      run: mkdir -p test/expected test/results

    - name: Cache OSRM data
      uses: actions/cache@v4
      with:
        path: |
          /tmp/osrm-data
        key: osrm-zeeland-${{ hashFiles('profiles/**/*.lua') }}
        restore-keys: |
          osrm-zeeland-

    - name: Download OSM data
      run: |
        echo "Downloading Zeeland OSM data..."
        wget -O zeeland-latest.osm.pbf "https://download.geofabrik.de/europe/netherlands/zeeland-latest.osm.pbf"
        ls -la zeeland-latest.osm.pbf

    - name: Build Docker image
      run: docker build -t osrm-test .

    - name: Start test services
      run: |
        docker compose -f docker-compose.test.yml up -d

    - name: Wait for data preparation to complete
      run: |
        echo "Checking osrm-prepare container status..."
        docker compose -f docker-compose.test.yml ps
        echo
        echo "Current osrm-prepare logs:"
        docker compose -f docker-compose.test.yml logs osrm-prepare
        echo
        echo "Waiting for data preparation to complete..."
        timeout 600 bash -c '
          while ! docker compose -f docker-compose.test.yml logs osrm-prepare 2>/dev/null | grep -q "Data preparation complete!"; do
            # Check if container has exited
            if ! docker compose -f docker-compose.test.yml ps | grep -q "osrm-prepare"; then
              echo "osrm-prepare container has exited, checking final logs..."
              docker compose -f docker-compose.test.yml logs osrm-prepare
              break
            fi
            echo -n "."
            sleep 10
          done
        '
        echo
        echo "Data preparation completed!"

    - name: Restart routing services
      run: |
        echo "Restarting routing services to pick up prepared data..."
        docker compose -f docker-compose.test.yml restart osrm-bus osrm-rail osrm-ferry
        sleep 10

    - name: Wait for routing services to be ready
      run: |
        echo "Waiting for routing services to be ready..."
        services=("bus:5001" "rail:5002" "ferry:5003")
        
        for service_port in "${services[@]}"; do
          IFS=':' read -r service port <<< "$service_port"
          echo "Checking $service service on port $port..."
          
          timeout 120 bash -c "
            until curl -sf \"http://localhost:$port/route/v1/driving/4.0,51.5;4.1,51.6?overview=false\" >/dev/null 2>&1; do
              echo -n '.'
              sleep 2
            done
          "
          echo " ✓ $service service is ready"
        done

    - name: Show service logs (debug)
      if: always()
      run: |
        echo "=== osrm-prepare logs ==="
        docker compose -f docker-compose.test.yml logs osrm-prepare
        echo "=== osrm-bus logs ==="
        docker compose -f docker-compose.test.yml logs osrm-bus
        echo "=== osrm-rail logs ==="
        docker compose -f docker-compose.test.yml logs osrm-rail
        echo "=== osrm-ferry logs ==="
        docker compose -f docker-compose.test.yml logs osrm-ferry

    - name: Download baseline responses (if exist)
      run: |
        # Try to download baseline from previous successful run
        # This step will fail on first run, which is expected
        gh run download --name test-baselines --dir test/expected || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run profile tests
      run: |
        chmod +x run-test.sh
        ./run-test.sh

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test/results/
        retention-days: 7

    - name: Upload baseline responses
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: test-baselines
        path: test/expected/
        retention-days: 30

    - name: Stop services
      if: always()
      run: docker compose -f docker-compose.test.yml down -v

    - name: Check for profile regressions
      if: failure()
      run: |
        echo "❌ Profile tests failed!"
        echo "This indicates that routing responses have changed compared to the baseline."
        echo "Review the test results to determine if this is expected (profile improvement) or a regression."
        echo ""
        echo "To update baselines after confirming changes are expected:"
        echo "1. Run locally: ./update-baselines.sh"
        echo "2. Commit the updated baseline files"
        exit 1